  h1 { margin: 0 0 4px; font-size: 30px; text-align: center; }

  button { border: 0; background: var(--accent); color: #fff; font-weight: 600; }

</style>

<script>
// The app below is encrypted with the parent's password. Without it this page is only a form.
(() => {
const STORED_KEY = 'zeus-key';
const sealed = document.getElementById('sealed').dataset;
const form = document.getElementById('login');

openWithStoredKey().catch(showForm);

form.onsubmit = async e => {
  e.preventDefault();
  error('Otwieram…');
  try {
    const key = await keyFrom(document.getElementById('password').value);
    const html = await decrypt(key);
    await remember(key);
    show(html);
  } catch {
    error('Złe hasło');
  }
};

async function openWithStoredKey() {
  const raw = localStorage.getItem(STORED_KEY);
  if (!raw) throw new Error('not logged in');
  const key = await crypto.subtle.importKey('raw', bytes(raw), 'AES-GCM', false, ['decrypt']);
  try {
    show(await decrypt(key));
  } catch (e) {
    localStorage.removeItem(STORED_KEY); // the password changed since this device logged in
    throw e;
  }
}

async function keyFrom(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(sealed.salt), iterations: Number(sealed.iterations), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decrypt(key) {
  const data = bytes(sealed.app);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12)));
}

async function remember(key) {
  try {
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    localStorage.setItem(STORED_KEY, btoa(String.fromCharCode(...raw)));
  } catch {} // private mode: the app still opens, it just asks again next time
}

function show(html) {
  // Swap in the whole app page. Scripts from a parsed document do not run, so re-create them to run once, in order.
  document.replaceChild(document.adoptNode(new DOMParser().parseFromString(html, 'text/html').documentElement), document.documentElement);
  for (const parsed of document.querySelectorAll('script')) {
    const script = document.createElement('script');
    script.textContent = parsed.textContent;
    parsed.replaceWith(script);
  }
}

function showForm() {
  form.hidden = false;
  document.getElementById('password').focus();
}

function error(text) { document.getElementById('error').textContent = text; }
function bytes(base64) { return Uint8Array.from(atob(base64), c => c.charCodeAt(0)); }
})(); // keeps these names out of the app's global scope
</script>
